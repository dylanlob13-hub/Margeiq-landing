<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MargeIQ — Welcome to Pro!</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:#080a0c;
  color:#eeecea;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  background:#131619;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:48px 36px;
  max-width:420px;
  width:100%;
  text-align:center;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{
  from{opacity:0;transform:scale(.92) translateY(16px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.emoji{
  font-size:4rem;
  display:block;
  margin-bottom:20px;
  animation:bounce .5s .2s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes bounce{
  from{transform:scale(0);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:1.9rem;
  font-weight:800;
  margin-bottom:10px;
  letter-spacing:-.04em;
}
.sub{
  font-size:.95rem;
  color:#9aa0aa;
  line-height:1.65;
  margin-bottom:28px;
}
.badge{
  display:inline-block;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#000;
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:.8rem;
  font-weight:700;
  padding:6px 16px;
  border-radius:20px;
  margin-bottom:28px;
}
.perks{
  background:#1a1e24;
  border-radius:14px;
  padding:18px;
  margin-bottom:28px;
  text-align:left;
}
.perk{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:.88rem;
  font-weight:500;
  color:#d1d5db;
  padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.perk:last-child{border-bottom:none;}
.perk-icon{color:#22c55e;font-size:1rem;flex-shrink:0;}
.btn{
  display:block;
  width:100%;
  background:#22c55e;
  color:#000;
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:1rem;
  font-weight:800;
  padding:15px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  text-decoration:none;
  transition:all .2s;
  box-shadow:0 0 30px rgba(34,197,94,.25);
}
.btn:hover{opacity:.88;transform:translateY(-2px);}
.note{
  font-size:.72rem;
  color:#6b7480;
  margin-top:14px;
}
</style>
</head>
<body>
<div class="card">
  <span class="emoji">🎉</span>
  <h1>You're now Pro!</h1>
  <p class="sub">Payment confirmed. Your full access is unlocked and ready to use.</p>
  <div class="badge">✦ MargeIQ Pro — Lifetime access</div>
  <div class="perks">
    <div class="perk"><span class="perk-icon">✓</span> Unlimited analyses</div>
    <div class="perk"><span class="perk-icon">✓</span> Smart simulator</div>
    <div class="perk"><span class="perk-icon">✓</span> Goal analysis</div>
    <div class="perk"><span class="perk-icon">✓</span> Volume projections</div>
    <div class="perk"><span class="perk-icon">✓</span> No restrictions, ever</div>
  </div>
  <a href="/app.html" class="btn">→ Start analyzing now</a>
  <p class="note">Click the button above when you're ready. No rush.</p>
</div>

<script>
/* Unlock Pro in localStorage */
(function(){
  localStorage.setItem('isPro','true');
  localStorage.removeItem('_miq_uses');
  sessionStorage.removeItem('_miq_uses');
  try{
    const log=JSON.parse(localStorage.getItem('miq_events')||'[]');
    log.push({e:'purchase_completed',t:Date.now(),source:'success_page'});
    localStorage.setItem('miq_events',JSON.stringify(log));
    if(window.posthog)posthog.capture('purchase_completed',{source:'success_page'});
    if(window.gtag)gtag('event','purchase',{value:9,currency:'EUR'});
  }catch(_){}
})();
</script>
</body>
</html>
